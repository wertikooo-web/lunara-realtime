name: Apply provider timeout replay fix

on:
  push:
    branches:
      - fix/provider-timeout-replay

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-timeout-replay
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/apply-provider-timeout-replay-fix.js
      - run: npm run smoke:ptt-lifecycle
      - run: npm run smoke:realtime

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/realtime/realtimeServer.js
          git diff --cached --quiet && exit 0
          git commit -m "Retry audio turn once after provider timeout"
          git push origin HEAD:fix/provider-timeout-replay
