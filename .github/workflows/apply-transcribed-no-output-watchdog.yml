name: Apply transcribed no-output watchdog

on:
  push:
    branches:
      - fix/transcribed-no-output-watchdog

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transcribed-no-output-watchdog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/apply-transcribed-no-output-watchdog.js
      - run: npm run smoke:ptt-lifecycle
      - run: npm run smoke:realtime
      - run: npm run smoke:ptt-tail
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/realtime/realtimeServer.js scripts/ptt-lifecycle-regression.js
          git diff --cached --quiet && exit 0
          git commit -m "Recover quickly when Gemini transcribes but produces no output"
          git push origin HEAD:fix/transcribed-no-output-watchdog
